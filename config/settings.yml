application:
  # dev开发环境 test测试环境 prod线上环境
  mode: dev
  # 服务名称
  name: testApp
  # 数据权限功能开关
  enabledp: false

logger:
  # 日志存放路径
  path: log
  # 控制台日志，stdout: True 表示要输出到控制台
  stdout: True
  # 日志等级, debug, info, warn, error, fatal
  level: debug
  # 每个日志文件最大 50 MB
  maxSize: 50  
  # error日志文件保留天数
  errorMaxage: 14  
  # info日志文件保留天数
  infoMaxage: 3  
  # 日志文件保留数量
  maxBackups: 10
  # 数据库日志开关，命令微服务需要打开，查询微服务需要关闭
  enableddb: false
  # 数据库日志打印级别（4：Info，3 Warn，2 Error，1 Silent）
  # 设置为 2 (Error) 只记录错误，避免 Outbox 轮询产生大量日志
  gormLoggerLevel: 4

# HTTP服务器配置 (Gin使用)  
http:  
  enabled: true            # 是否启用HTTP服务  
  host: 0.0.0.0            # 服务器ip，默认使用 0.0.0.0  
  port: 8003               # HTTP端口号  
  readtimeout: 1           # 读取超时时间(秒)  
  writetimeout: 2          # 写入超时时间(秒)  
  idletimeout: 60          # 空闲连接超时时间(秒)  
  maxheaderbytes: 1        # 最大请求头大小(MB)  
  ssl:  
    enabled: false           # 是否启用HTTPS  
    keystr: "./cert.pem"     # 私钥内容（字符串形式）
    pem: "./key.pem"         # 证书内容（PEM格式，字符串形式）
    domain: "localhost:8000" # 证书域名（用于生成证书） 

jwt:
  # token 密钥，生产环境时及的修改
  secret: jxt
  # token 过期时间 单位：秒
  timeout: 3600
  # 过期前多长时间开始更换token 单位：秒
  replaceTime: 30

cache:
#    redis:
#      addr: 127.0.0.1:6379
#      password: xxxxxx
#      db: 2
  # key存在即可
  memory: ''

queue:
  memory:
    poolSize: 100
#    redis:
#      addr: 127.0.0.1:6379
#      password: xxxxxx
#      producer:
#        streamMaxLength: 100
#        approximateMaxLength: true
#      consumer:
#        visibilityTimeout: 60
#        bufferSize: 100
#        concurrency: 10
#        blockingTimeout: 5
#        reclaimInterval: 1

locker:
  redis:

# EventBus 配置 - Kafka (RedPanda)
eventbus:
  type: kafka
  serviceName: "process-management-service"  # 服务名称（必需，ASCII only）

  # Kafka 配置
  kafka:
    brokers:
      - "redpanda:9092"  # Docker 环境使用服务名
    
    # Producer 配置
    producer:
      clientId: "process-management-producer"  # ASCII only
      acks: "all"  # 等待所有副本确认
      compression: "snappy"  # 压缩算法
      maxMessageBytes: 1048576  # 1MB
      timeout: 10s
      retries: 3
      idempotent: true  # 幂等性保证
    
    # Consumer 配置
    consumer:
      groupId: "process-management-consumer-group"  # distinct from evidence-command (PR-6 §9)
      clientId: "process-management-consumer"  # ASCII only
      autoOffsetReset: "earliest"  # 从最早的消息开始消费
      enableAutoCommit: false  # 手动提交 offset
      sessionTimeout: 10s
      heartbeatInterval: 3s
    
    # 安全配置
    security:
      enabled: false

  # 指标配置
  metrics:
    enabled: true

  # 链路追踪配置
  tracing:
    enabled: false
    sampleRate: 0.1

# 注意：Outbox 配置通过代码配置（在 command/internal/infrastructure/outbox/dependencies.go 中）
# jxt-core 的 Outbox 组件设计为库组件，通过代码配置更灵活

# ETCD配置 - 作为公共基础设施
etcd:
  enabled: true
  hosts:
    - "etcd:2379"                # Docker环境使用服务名
    # - "etcd:2380"              # 生产环境可添加更多节点
    # - "localhost:2379"         # 非Docker环境使用
  username: ""
  password: ""
  namespace: "jxt/"              # 命名空间前缀，用于隔离不同环境
  dialTimeout: 5                 # 连接超时(秒)
  timeout: 3                     # 操作超时(秒)
  tls:
    enabled: false               # 开发环境可关闭TLS

# ========================================
# gRPC配置 - 使用SDK标准格式
# ========================================
grpc:
  # gRPC客户端配置 - 调用其他微服务  
  client:
    enabled: true                                    # 临时禁用gRPC客户端
    serviceKey: "security-management/services"         # 服务发现键名
    timeout: 5000                                      # 超时时间(毫秒)
    keepaliveTime: "30s"                              # Keepalive时间
    useDiscovery: true                                # 使用服务发现
    retries: 3                                        # 重试次数
    nonBlock: false                                   # 非阻塞模式
    maxRecvMsgSize: 4194304                          # 最大接收消息大小(4MB)
    maxSendMsgSize: 4194304                          # 最大发送消息大小(4MB)
    
    # 中间件配置
    middlewares:
      trace: true                                     # 链路跟踪
      duration: true                                  # 持续时间统计
      prometheus: true                                # Prometheus监控
      breaker: true                                   # 熔断器

  # gRPC服务端配置 - 提供服务给其他微服务
  server:
    enabled: false                       # 是否开启gRPC服务端
    listenOn: ":9000"                   # 监听地址和端口
    serviceKey: "security-management/services"  # 服务注册键
    timeout: 5000                       # 超时时间(毫秒)
    # 认证配置
    auth: false                         # 是否启用认证
    # 性能控制
    cpuThreshold: 900                   # CPU阈值
    strictControl: false                # 严格控制模式
    maxRecvMsgSize: 4194304            # 最大接收消息大小(4MB)
    maxSendMsgSize: 4194304            # 最大发送消息大小(4MB)
    # TLS配置
    tls:
      enabled: false                     # 是否启用TLS
    # KeepAlive配置
    keepAlive:
      maxConnectionIdle: "15m"           # 最大空闲时间
      maxConnectionAge: "30m"            # 最大连接时间
      time: 5000                         # KeepAlive时间(毫秒)
      timeout: 1000                      # KeepAlive超时(毫秒)
    # 中间件配置
    middlewares:
      trace: true                        # 链路跟踪
      prometheus: true                   # Prometheus监控
      breaker: true                      # 熔断器

# 外部服务集成配置  
integrations:  
  email:  
    provider: "smtp"  
    host: "smtp.example.com"  
    port: 587  
    username: "user@example.com"  
    password: "email_password"  
  
  storage:  
    provider: "s3"  
    region: "us-west-2"  
    bucket: "app-files"  
    accessKey: "s3_access_key"  
    secretKey: "s3_secret_key"  

# 功能标志配置 - 可在运行时切换功能  
features:  
  newDashboard: true  
  advancedAnalytics: false  
  betaFeatures: false  