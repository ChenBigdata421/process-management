version: '3.8'

services:
  # PostgreSQL 数据库服务 (本项目专用)
  postgres-process:
    image: postgres:latest
    container_name: postgres-process-management
    environment:
      POSTGRES_USER: tenant_1_process-management
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tenant_default_process
      TZ: Asia/Shanghai
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
      POSTGRES_WORK_MEM: 4MB
    volumes:
      - postgres_process_data:/var/lib/postgresql
    # ports:
    #   - "5436:5432"
    networks:
      - process-data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_1_process-management -d tenant_default_process"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # API 服务
  process-management-api:
    build:
      context: ..
      dockerfile: process-management/Dockerfile.api
    container_name: process-management-api
    environment:
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      # 服务配置
      SERVER_PORT: :8003
      GIN_MODE: release
      TZ: Asia/Shanghai
    ports:
      - "8003:8003"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres-process:
        condition: service_healthy
    networks:
      - jxt-web
      - process-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_process_data:

networks:
  process-data:
    driver: bridge
    internal: true
    name: jxt-process-data
  jxt-web:
    external: true
    name: jxt-web
